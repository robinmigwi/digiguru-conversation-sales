<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DigiGuru Control Center</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17352c;background:#f4f7f3}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1240px;margin:0 auto;padding:28px 18px 52px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
h1{margin:0;font-size:28px}.sub{margin-top:6px;color:#68756f}.grid{display:grid;grid-template-columns:1.05fr 1.5fr;gap:18px}
.card{background:#fff;border:1px solid #dbe5de;border-radius:18px;padding:20px;box-shadow:0 7px 24px rgba(18,55,43,.05)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.section-title{margin:0;font-size:18px}.muted{color:#748079}.danger{color:#a33;font-size:13px}
button{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer}.primary{background:#17352c;color:#fff}.secondary{background:#edf2ee;color:#17352c}
input,textarea,select{width:100%;padding:10px 11px;border:1px solid #ccd7cf;border-radius:9px;background:#fff;font:inherit;color:#17352c}textarea{min-height:92px;resize:vertical}
label{display:block;margin:12px 0 6px;font-size:12px;font-weight:800;color:#5e6b65}.hidden{display:none!important}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #edf1ed;font-size:14px}th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#7a8580}.row{cursor:pointer}.row:hover{background:#fafcf9}
.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf3ee;font-size:11px;font-weight:800}.progress{height:7px;background:#e8eeea;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:#2f7d60}
.progress-row{display:flex;align-items:center;gap:9px}.progress-row .progress{flex:1}.small{font-size:12px}.stack>*+*{margin-top:12px}
.stage{display:grid;grid-template-columns:1.1fr 150px 26px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #edf1ed}.stage-name{font-weight:700}.stage-dot{font-size:13px;text-align:center}.stage select{padding:8px}
.links{display:flex;gap:8px;flex-wrap:wrap}.config-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.config-item{padding:12px;background:#f8faf8;border:1px solid #e4ebe6;border-radius:11px}.config-item strong{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#75817b;margin-bottom:5px}.action-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.notice{padding:11px 13px;border-radius:10px;background:#f0f6f2;color:#53635b;font-size:12px;line-height:1.5}
@media(max-width:950px){.grid{grid-template-columns:1fr}}@media(max-width:640px){header{flex-direction:column}.config-grid{grid-template-columns:1fr}.stage{grid-template-columns:1fr 135px 20px}}
</style>
</head>
<body>
<div class="wrap">
<div id="loginView" class="card" style="max-width:430px;margin:10vh auto">
<h1>DigiGuru Control Center</h1><p class="sub">Internal implementation workspace</p>
<form id="loginForm"><label>Admin token</label><input id="loginToken" type="password" required autocomplete="current-password"><div style="margin-top:14px;text-align:right"><button class="primary">Sign in</button></div><p id="loginError" class="danger"></p></form>
</div>

<main id="appView" class="hidden">
<header>
<div><div style="font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#2d6f57">DigiGuru Engine</div><h1>Control Center</h1><div class="sub">Manage client onboarding, configuration and implementation readiness.</div></div>
<button id="logoutBtn" class="secondary">Sign out</button>
</header>

<div class="grid">
<section class="card">
<div class="toolbar"><div><h2 class="section-title">Clients</h2><div class="muted small">The same engine, configured differently for each business.</div></div><button id="newClientBtn" class="primary">New client</button></div>
<div id="clientTable"></div>
<div id="newClientCard" class="hidden" style="margin-top:16px;padding-top:16px;border-top:1px solid #edf1ed">
<form id="clientForm">
<label>Client ID</label><input name="clientId" placeholder="noka-foods" required>
<label>Business name</label><input name="businessName" placeholder="Noka Foods" required>
<label>Industry</label><input name="industry" placeholder="Food / Ecommerce">
<label>Primary goal</label><textarea name="salesGoal" placeholder="What should DigiGuru improve for this business?"></textarea>
<label>Business description</label><textarea name="businessDescription"></textarea>
<div class="action-row" style="justify-content:flex-end;margin-top:14px"><button type="button" id="cancelNew" class="secondary">Cancel</button><button class="primary">Create client</button></div>
<p id="clientError" class="danger"></p>
</form>
</div>
</section>

<section id="selectedPanel" class="stack">
<div class="card"><div id="details"><div class="muted">Select a client to open its implementation workspace.</div></div></div>
</section>
</div>
</main>
</div>

<script>
const loginView=document.getElementById("loginView");
const appView=document.getElementById("appView");
const table=document.getElementById("clientTable");
const newCard=document.getElementById("newClientCard");
const details=document.getElementById("details");

const esc=s=>String(s??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#39;");
async function api(url,options={}){
 const res=await fetch(url,{credentials:"same-origin",...options,headers:{"content-type":"application/json",...(options.headers||{})}});
 const data=await res.json().catch(()=>({}));
 if(!res.ok)throw new Error(data.error||"Request failed.");
 return data;
}
const stages=[
 ["commercial_status","Commercial"],
 ["discovery_status","Discovery"],
 ["meta_status","Meta access"],
 ["whatsapp_status","WhatsApp connection"],
 ["data_status","Business data"],
 ["conversation_status","Conversation design"],
 ["integration_status","Integrations"],
 ["testing_status","Testing"],
 ["approval_status","Client approval"],
 ["go_live_status","Go live"]
];
const statusOptions=["NOT_STARTED","IN_PROGRESS","BLOCKED","PENDING_REVIEW","COMPLETE"];
const statusLabel=s=>({"NOT_STARTED":"Not started","IN_PROGRESS":"In progress","BLOCKED":"Blocked","PENDING_REVIEW":"Pending review","COMPLETE":"Complete"}[s]||s||"Not started");
const pct=r=>{const done=stages.filter(([k])=>r[k]==="COMPLETE").length;return Math.round(done/stages.length*100);};

async function loadClients(){
 const clients=await api("/api/internal/clients");
 if(!clients.length){table.innerHTML='<div class="muted">No clients yet.</div>';return;}
 table.innerHTML='<table><thead><tr><th>Business</th><th>Status</th><th>Progress</th></tr></thead><tbody>'+
 clients.map(c=>'<tr class="row" data-id="'+esc(c.client_id)+'"><td><strong>'+esc(c.business_name)+'</strong><div class="muted small">'+esc(c.industry||"")+'</div></td><td><span class="pill">'+esc(c.status)+'</span></td><td><div class="progress-row"><div class="progress"><span style="width:'+pct(c)+'%"></span></div><span class="muted small">'+pct(c)+'%</span></div></td></tr>').join("")+
 '</tbody></table>';
 document.querySelectorAll(".row").forEach(r=>r.onclick=()=>loadClient(r.dataset.id));
}

async function loadClient(id){
 const client=await api("/api/internal/clients/"+encodeURIComponent(id));
 const onb=await api("/api/internal/clients/"+encodeURIComponent(id)+"/onboarding");
 const capabilityNames=Object.entries(client.capabilities||{}).filter(([,v])=>Boolean(v)).map(([k])=>k).join(", ")||"None selected";
 details.innerHTML=
 '<div class="toolbar"><div><div style="font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#2d6f57">Client workspace</div><h2 class="section-title" style="font-size:24px;margin-top:4px">'+esc(client.business_name)+'</h2><div class="muted small">'+esc(client.industry||"Industry not set")+' · '+esc(client.client_id)+'</div></div><span class="pill">'+esc(client.status)+'</span></div>'+
 '<div class="links" style="margin-bottom:14px"><button id="generateLink" class="primary">Generate onboarding link</button><button id="openOnboarding" class="secondary">Open existing link</button></div>'+
 '<div id="linkBox" class="hidden notice"></div>'+
 '<div class="config-grid">'+
 '<div class="config-item"><strong>Primary goal</strong>'+esc(client.sales_goal||"Not set")+'</div>'+
 '<div class="config-item"><strong>Contact</strong>'+esc(onb.contact_name||"Not captured")+(onb.contact_email?" · "+esc(onb.contact_email):"")+'</div>'+
 '<div class="config-item"><strong>Capabilities</strong>'+esc(capabilityNames)+'</div>'+
 '<div class="config-item"><strong>Client submission</strong>'+esc(onb.submitted_at?new Date(onb.submitted_at).toLocaleString():"Not submitted")+'</div>'+
 '</div>'+
 '<div style="margin-top:18px"><h3 class="section-title">Implementation checklist</h3><div class="muted small" style="margin:5px 0 8px">Update these as the project moves from discovery to go live.</div>'+
 stages.map(([key,label])=>'<div class="stage"><div class="stage-name">'+esc(label)+'</div><select data-stage="'+key+'">'+statusOptions.map(s=>'<option value="'+s+'" '+(onb[key]===s?"selected":"")+'>'+statusLabel(s)+'</option>').join("")+'</select><div class="stage-dot">'+(onb[key]==="COMPLETE"?"✓":"")+'</div></div>').join("")+
 '</div>'+
 '<div style="margin-top:18px"><h3 class="section-title">Internal implementation notes</h3><textarea id="internalNotes" placeholder="Access still needed, decisions made in the onboarding session, testing observations, next actions…">'+esc(onb.internal_notes||"")+'</textarea><div class="action-row" style="justify-content:flex-end;margin-top:8px"><span id="statusSave" class="muted small"></span><button id="saveNotes" class="secondary">Save notes</button></div></div>'+
 '<div style="margin-top:18px" class="notice">Client answers feed the business configuration. Technical credentials and Meta or WhatsApp access stay under DigiGuru controlled setup and are never collected through the client form.</div>';

 let existingLink="";
 document.getElementById("generateLink").onclick=async()=>{
   const btn=document.getElementById("generateLink");btn.disabled=true;btn.textContent="Generating…";
   try{const r=await api("/api/internal/clients/"+encodeURIComponent(id)+"/onboarding-link",{method:"POST"});existingLink=r.onboardingUrl;showLink(r);}catch(e){showLink({error:e.message});}finally{btn.disabled=false;btn.textContent="Generate onboarding link";}
 };
 document.getElementById("openOnboarding").onclick=()=>{if(existingLink)window.open(existingLink,"_blank");else showLink({error:"Generate a new onboarding link first."});};
 function showLink(r){
   const box=document.getElementById("linkBox");box.classList.remove("hidden");
   if(r.error){box.textContent=r.error;return;}
   existingLink=r.onboardingUrl;
   box.innerHTML='<div><strong>Client onboarding link</strong></div><div class="action-row" style="margin-top:8px"><input id="generatedLink" readonly value="'+esc(existingLink)+'" style="flex:1;min-width:220px"><button id="copyLink" class="secondary">Copy</button><button id="openLink" class="secondary">Open</button></div><div style="margin-top:6px">Expires '+esc(new Date(r.expiresAt).toLocaleDateString())+'. Generating another link invalidates the previous one.</div>';
   document.getElementById("copyLink").onclick=async()=>{await navigator.clipboard.writeText(existingLink);document.getElementById("copyLink").textContent="Copied";};
   document.getElementById("openLink").onclick=()=>window.open(existingLink,"_blank");
 }
 document.querySelectorAll("[data-stage]").forEach(select=>select.onchange=async()=>{
   select.disabled=true;document.getElementById("statusSave").textContent="Saving…";
   try{await api("/api/internal/clients/"+encodeURIComponent(id)+"/onboarding",{method:"PATCH",body:JSON.stringify({stage:select.dataset.stage,status:select.value})});document.getElementById("statusSave").textContent="Saved";await loadClients();}catch(e){document.getElementById("statusSave").textContent=e.message;}finally{select.disabled=false;}
 });
 document.getElementById("saveNotes").onclick=async()=>{
   const btn=document.getElementById("saveNotes");btn.disabled=true;document.getElementById("statusSave").textContent="Saving…";
   try{await api("/api/internal/clients/"+encodeURIComponent(id)+"/onboarding",{method:"PATCH",body:JSON.stringify({stage:"commercial_status",status:onb.commercial_status,internalNotes:document.getElementById("internalNotes").value})});document.getElementById("statusSave").textContent="Notes saved";}catch(e){document.getElementById("statusSave").textContent=e.message;}finally{btn.disabled=false;}
 };
}

async function start(){
 try{await api("/api/internal/clients");loginView.classList.add("hidden");appView.classList.remove("hidden");await loadClients();}
 catch{loginView.classList.remove("hidden");appView.classList.add("hidden");}
}
document.getElementById("loginForm").onsubmit=async e=>{
 e.preventDefault();document.getElementById("loginError").textContent="";
 try{await api("/admin/login",{method:"POST",body:JSON.stringify({token:document.getElementById("loginToken").value})});document.getElementById("loginToken").value="";await start();}
 catch(err){document.getElementById("loginError").textContent=err.message;}
};
document.getElementById("logoutBtn").onclick=async()=>{await fetch("/admin/logout",{method:"POST",credentials:"same-origin"});start();};
document.getElementById("newClientBtn").onclick=()=>newCard.classList.remove("hidden");
document.getElementById("cancelNew").onclick=()=>newCard.classList.add("hidden");
document.getElementById("clientForm").onsubmit=async e=>{
 e.preventDefault();const payload=Object.fromEntries(new FormData(e.target).entries());
 try{await api("/api/internal/clients",{method:"POST",body:JSON.stringify(payload)});e.target.reset();newCard.classList.add("hidden");await loadClients();}
 catch(err){document.getElementById("clientError").textContent=err.message;}
};
start();
</script>
</body>
</html>
